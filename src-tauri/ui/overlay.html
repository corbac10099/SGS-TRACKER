<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>SGS-Tracker In-Game Overlay</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: transparent !important;
      overflow: hidden;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body style="background: transparent;">
  <script>
    // Redirection immédiate vers la route overlay Next.js sans charger le dashboard principal
    var isOnline = window.location.hostname.includes('vercel.app') || window.location.href.includes('online');
    var targetUrl = isOnline ? 'https://tracker-sgs.vercel.app/overlay' : 'http://localhost:3000/overlay';
    window.location.replace(targetUrl);
  </script>
</body>
</html>
