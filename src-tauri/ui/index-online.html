<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SGS-Tracker — Bureau Officiel</title>
  <style>
    :root {
      --bg: #0a0e13;
      --surface: #121820;
      --border: rgba(255, 255, 255, 0.08);
      --red: #ff4655;
      --red-hover: #ff5865;
      --text: #f0f2f5;
      --text-muted: #8b97a8;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      user-select: none;
      overflow: hidden;
    }
    .card {
      background: radial-gradient(circle at 50% 0%, rgba(255, 70, 85, 0.12), transparent 70%), var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 40px 32px;
      max-width: 480px;
      width: 90%;
      text-align: center;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.7), 0 0 1px rgba(255, 70, 85, 0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .logo-container {
      width: 72px;
      height: 72px;
      margin-bottom: 20px;
    }
    .logo {
      width: 100%;
      height: 100%;
      border-radius: 18px;
      border: 1px solid var(--border);
      box-shadow: 0 10px 30px rgba(255, 70, 85, 0.25);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(255, 70, 85, 0.15);
      color: var(--red);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 14px;
    }
    .spinner {
      width: 12px;
      height: 12px;
      border: 2px solid currentColor;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h1 {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    p.sub {
      color: var(--text-muted);
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .btn {
      padding: 13px 18px;
      border-radius: 14px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
      width: 100%;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .btn-retry {
      background: var(--red);
      color: #fff;
      box-shadow: 0 4px 15px rgba(255, 70, 85, 0.35);
      display: none;
    }
    .btn-retry:hover {
      background: var(--red-hover);
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-container">
      <img src="icon.png" alt="SGS-Tracker" class="logo" onerror="this.style.display='none'">
    </div>

    <div class="badge" id="statusBadge">
      <div class="spinner" id="spinner"></div>
      <span id="statusText">Connexion en cours...</span>
    </div>

    <h1>SGS-Tracker</h1>
    <p class="sub" id="subText">Connexion aux serveurs officiels Spycam...</p>

    <button class="btn btn-retry" id="btnRetry" onclick="connectOnline()">🔄 Réessayer</button>
  </div>

  <script>
    var OFFICIAL_URL = "https://spycam-tan.vercel.app";

    function connectOnline() {
      var badge = document.getElementById('statusBadge');
      var spinner = document.getElementById('spinner');
      var statusText = document.getElementById('statusText');
      var subText = document.getElementById('subText');
      var btnRetry = document.getElementById('btnRetry');

      spinner.style.display = 'block';
      statusText.textContent = "Connexion en cours...";
      subText.textContent = "Lancement des services en ligne...";
      btnRetry.style.display = 'none';

      // Redirection immédiate vers les serveurs officiels
      window.location.replace(OFFICIAL_URL);
    }

    // Lancement direct
    connectOnline();
  </script>
</body>
</html>
