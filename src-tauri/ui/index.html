<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SGS-Tracker — Bureau Local (Dev)</title>
  <style>
    :root {
      --bg: #0a0e13;
      --surface: #121820;
      --border: rgba(255, 255, 255, 0.08);
      --red: #ff4655;
      --emerald: #10b981;
      --emerald-hover: #059669;
      --text: #f0f2f5;
      --text-muted: #8b97a8;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      user-select: none;
      overflow: hidden;
    }
    .card {
      background: radial-gradient(circle at 50% 0%, rgba(16, 185, 129, 0.12), transparent 70%), var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 40px 32px;
      max-width: 480px;
      width: 90%;
      text-align: center;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.7), 0 0 1px rgba(16, 185, 129, 0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .logo-container {
      width: 72px;
      height: 72px;
      margin-bottom: 20px;
    }
    .logo {
      width: 100%;
      height: 100%;
      border-radius: 18px;
      border: 1px solid var(--border);
      box-shadow: 0 10px 30px rgba(16, 185, 129, 0.25);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(16, 185, 129, 0.15);
      color: var(--emerald);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 14px;
    }
    .badge.offline {
      background: rgba(255, 70, 85, 0.15);
      color: var(--red);
    }
    .spinner {
      width: 12px;
      height: 12px;
      border: 2px solid currentColor;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h1 {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    p.sub {
      color: var(--text-muted);
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .btn {
      padding: 13px 18px;
      border-radius: 14px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
      width: 100%;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .btn-retry {
      background: var(--emerald);
      color: #fff;
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.35);
      display: none;
    }
    .btn-retry:hover {
      background: var(--emerald-hover);
      transform: translateY(-1px);
    }
    .hint {
      margin-top: 14px;
      font-size: 11px;
      color: var(--text-muted);
      display: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-container">
      <img src="icon.png" alt="SGS-Tracker" class="logo" onerror="this.style.display='none'">
    </div>

    <div class="badge" id="statusBadge">
      <div class="spinner" id="spinner"></div>
      <span id="statusText">Connexion au serveur local...</span>
    </div>

    <h1>SGS-Tracker (Local)</h1>
    <p class="sub" id="subText">Tentative de liaison avec http://localhost:3000...</p>

    <button class="btn btn-retry" id="btnRetry" onclick="tryConnect()">🔄 Réessayer la connexion</button>
    <p class="hint" id="hintText">💡 Astuce : Démarrez le tracker via AppControl ("⚡ Démarrer Tracker") puis cliquez sur Réessayer.</p>
  </div>

  <script>
    var LOCAL_URL = "http://localhost:3000";

    async function checkServer() {
      try {
        var controller = new AbortController();
        var timer = setTimeout(function() { controller.abort(); }, 800);
        await fetch(LOCAL_URL + "/manifest.webmanifest", {
          signal: controller.signal,
          mode: 'no-cors',
          cache: 'no-store'
        });
        clearTimeout(timer);
        return true;
      } catch (_) {
        return false;
      }
    }

    async function tryConnect() {
      var badge = document.getElementById('statusBadge');
      var spinner = document.getElementById('spinner');
      var statusText = document.getElementById('statusText');
      var subText = document.getElementById('subText');
      var btnRetry = document.getElementById('btnRetry');
      var hintText = document.getElementById('hintText');

      badge.classList.remove('offline');
      spinner.style.display = 'block';
      statusText.textContent = "Connexion au serveur local...";
      subText.textContent = "Vérification de http://localhost:3000...";
      btnRetry.style.display = 'none';
      hintText.style.display = 'none';

      var isUp = await checkServer();
      if (isUp) {
        statusText.textContent = "Serveur local actif";
        subText.textContent = "Chargement de vos modifications locales...";
        setTimeout(function() {
          window.location.replace(LOCAL_URL);
        }, 500);
      } else {
        badge.classList.add('offline');
        spinner.style.display = 'none';
        statusText.textContent = "Serveur local éteint";
        subText.textContent = "Impossible de joindre le port 3000. Assurez-vous que le tracker local est démarré.";
        btnRetry.style.display = 'block';
        hintText.style.display = 'block';
      }
    }

    tryConnect();
  </script>
</body>
</html>
